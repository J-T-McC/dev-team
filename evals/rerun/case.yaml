schema_version: "1.1"
name: rerun
description: "Setup in a project that is already set up: it says so and offers changes instead of setting up again."
tags: [setup, stage-1, rerun]
runs: 3
execution:
  prompt: "Set up dev-team in this project."
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
