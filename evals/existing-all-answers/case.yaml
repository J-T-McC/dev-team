schema_version: "1.1"
name: existing-all-answers
description: "An existing project with every answer given: the harvest follows what actually runs and files the mismatch."
tags: [setup, stage-2, existing]
runs: 3
execution:
  prompt: "Set up dev-team in this project. My answers: it's my project, shared with the repository; standard autonomy; keep the project's commit style; no extras. Use the standards you find as proposed, and your suggestions for any you can't find. Don't ask me anything else: go ahead and set it up."
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
