schema_version: "1.1"
name: existing-no-answers
description: "An existing project with a commit convention: setup suggests keeping it, quoting a real commit, and writes nothing."
tags: [setup, stage-1, existing]
runs: 3
execution:
  prompt: "Set up dev-team in this project."
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
