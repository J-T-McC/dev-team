schema_version: "1.1"
name: stack-missing-facts
description: "The user lets the team pick the stack but leaves out where it runs: setup asks before picking."
tags: [setup, stage-1, new, stack]
runs: 3
execution:
  prompt: "Set up dev-team in this project. My answers: it's my project, shared with the repository; standard autonomy; dev-team's commit style. I'm building a habit tracker. For the stack, let the team pick."
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
