schema_version: "1.1"
name: new-no-answers
description: "A new project with no answers given: setup shows its first questions and writes nothing."
tags: [setup, stage-1, new]
runs: 3
execution:
  prompt: "Set up dev-team in this project."
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
