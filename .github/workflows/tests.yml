name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: tests/*.sh
        run: |
          fail=0
          for t in tests/*.sh; do
            echo "== $t"
            bash "$t" || fail=1
          done
          exit $fail
