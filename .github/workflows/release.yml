name: release

# Every merge to main: semantic-release reads the squash commit (the PR title) and tags a release when it calls for one.
# The `due` job skips the release job when no commit since the last tag calls for a release (.github/release-due.sh).
# feat → minor, fix or perf → patch, `!` or a BREAKING CHANGE footer → major, any other type → no release.
# It only tags and writes the GitHub release; nothing is committed back to main. Config: .releaserc.json.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: if bash .github/release-due.sh >&2; then echo due=true; else echo due=false; fi >> "$GITHUB_OUTPUT"

  release:
    needs: due
    if: needs.due.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: semantic-release
        run: npx --yes -p semantic-release@25.0.9 -p conventional-changelog-conventionalcommits@9 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
